# File: $XDG_CONFIG_HOME/parra/niri.toml
#
# Every key below is optional and shown with its default.

[general]
# Layer-shell namespace, for compositor rules that match on it. Defaults to the
# program's own name.
#
# This is useful for placing the wallpaper in the overview backdrop in niri with
# a layer-rule. See docs/config.md.
#namespace = "parra"

# Which layer to sit on: "background" or "bottom".
layer = "background"

[wallpaper]
# What to show when nothing has been set over the control socket. Absolute, or
# `~`-prefixed, or relative to this file's directory.
#
# A wallpaper set with `parra set` is remembered across restarts and takes
# precedence over this, so leaving it unset means the first start is blank.
#fallback = "~/pictures/wall.png"

[compositor]
# What niri position moves each parallax axis. It applies to every output.
#
#   "workspace"  the active workspace among that output's workspaces
#   "column"     the focused column of that output's active workspace
#   "none"       nothing, leaving the axis centred
vertical   = "workspace"
horizontal = "none"

# When an output blurs, whether the outputs decide it one by one or together, and how
# the overview affects it.
#
#   when      "focused"    it holds the focused window
#             "non-empty"  its active workspace holds any window, focused or not
#   scope     "output"     each output answers for itself
#             "global"     every output blurs as soon as one of them answers yes
#   overview  "blur"       blurred for as long as the overview is open
#             "clear"      sharp for as long as the overview is open
#             "follow"     the overview does not change what `when` and `scope` decided
#
# What a blur looks like is `[blur]` below; this is when one happens.
blur = { when = "non-empty", scope = "output", overview = "clear" }

# One monitor can differ, inheriting whatever it leaves out:
#
# [output."eDP-1".compositor]
# horizontal = "column"

[scroll.vertical]
# Fraction of the available travel to use, measured about the centre. 1 uses all of
# it, 0 pins the image to the centre.
travel = 1.0

# Runs the axis the other way, so the first workspace or column sits where the last
# one otherwise would. Measured about the centre, so a centred axis does not move.
invert = false

# Furthest the image may move between two adjacent workspaces or columns, in screen
# heights here and screen widths on the horizontal axis. 0 lifts the cap. Only a
# wallpaper much taller or wider than the screen ever has a stop long enough to
# reach this.
max-shift = 0.3

# 0 makes the move instant.
duration-ms = 300

# linear, out-quad, in-out-quad, out-cubic, in-out-cubic, out-quint
easing = "out-cubic"

[scroll.horizontal]
travel      = 1.0
invert      = false
max-shift   = 0.3
duration-ms = 300
easing      = "out-cubic"

[blur]
# 0 disables blur entirely, skipping the bake.
radius = 32

# Linear downscale of the baked blur texture. Higher is cheaper and smaller.
downscale = 4

# #rgb, #rgba, #rrggbb, #rrggbbaa
tint = "#101010"

# Multiplied into the tint's own alpha.
tint-opacity = 0.5

duration-ms = 300
easing      = "in-out-cubic"

[zoom]
# Fraction of the image visible while the compositor is not asking for the wider
# view of an output, which in niri is the overview. The rest is the headroom the
# parallax scrolls through, so 1.0 means no scrolling at all in one of the axes.
crop-ratio  = 0.8
duration-ms = 300
easing      = "out-cubic"

[transition]
# "fade" crossfades the outgoing wallpaper into the incoming one, holding both in
# video memory until it finishes, and fades one out on its own when nothing replaces
# it.
#
# "none" swaps outright and costs nothing.
mode        = "fade"
duration-ms = 800
easing      = "in-out-cubic"

# Per-output overrides, keyed by connector name as the compositor reports it.
# Any key left out is inherited from the sections above, `compositor` included.
# [output."DP-1"]
# blur.radius = 48
# scroll.vertical.travel = 0.5
#
# [output."eDP-1"]
# wallpaper.fallback = "~/pictures/other.png"
