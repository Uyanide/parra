[package]
name = "render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
thiserror.workspace = true
tracing.workspace = true

# `system` routes wayland-client through libwayland rather than the pure-Rust backend.
# wl_egl_window needs real libwayland proxies, so this is a requirement, not a preference.
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-egl = "0.32.11"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

khronos-egl = { version = "6.0.0", features = ["static"] }
glow = "0.18.0"

fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "qoi",
    "tiff",
    "webp",
] }
